# =============================================================================
# Configuração de Avaliação — Gemma 4 Adaptação pt-BR
# =============================================================================
# Suite completa de benchmarks para avaliar adaptação linguística ao português.
# Inclui benchmarks obrigatórios, exploratórios e retenção em inglês.

evaluation:
  seed: 42
  temperature: 0.0
  max_new_tokens: 512
  batch_size: 8
  use_vllm: true
  cache_dir: "outputs/eval_cache"

  # Logprob scoring: for MCQ tasks, score by comparing log-probabilities
  # of each answer option (more stable than generate+parse, no format errors)
  # Only used when use_vllm=false, think_mode=off, and metric=accuracy
  use_logprob: true

  # Modos de pensamento: avalia com e sem cadeia de raciocínio
  think_modes: ["off", "on"]
  # Quando think_on, remove <think>...</think> antes de computar métricas
  strip_think_from_output: true
  # Para modelos que esperam canal de thought vazio
  empty_think_channel: false

benchmarks:
  # =========================================================================
  # GRUPO: Brasil Geral (vestibulares e provas nacionais)
  # =========================================================================
  enem_2022:
    task: "enem"
    year: 2022
    group: "brasil_geral"
    metric: "accuracy"
    num_shots: 0
    hub_id: "maritaca-ai/enem"
    subset: "2022"
    enabled: true

  enem_2023:
    task: "enem"
    year: 2023
    group: "brasil_geral"
    metric: "accuracy"
    num_shots: 0
    hub_id: "maritaca-ai/enem"
    subset: "2023"
    enabled: true

  enem_2024:
    task: "enem"
    year: 2024
    group: "brasil_geral"
    metric: "accuracy"
    num_shots: 0
    hub_id: "maritaca-ai/enem"
    subset: "2024"
    enabled: true

  bluex:
    task: "bluex"
    group: "brasil_geral"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/bluex was fabricated. Replaced with eduagarcia-temp/BLUEX_without_images
    # (public, split "train", 724 rows, no images — better for text-only eval).
    hub_id: "eduagarcia-temp/BLUEX_without_images"
    enabled: true

  # =========================================================================
  # GRUPO: Semântica (inferência textual, similaridade, paráfrase)
  # =========================================================================
  assin2_rte:
    task: "assin2_rte"
    group: "semantica"
    metric: "accuracy"
    num_shots: 5
    # "assin2" resolves via a Hub redirect; use the canonical id directly.
    hub_id: "nilc-nlp/assin2"
    enabled: true

  assin2_sts:
    task: "assin2_sts"
    group: "semantica"
    metric: "pearson"
    num_shots: 5
    # "assin2" resolves via a Hub redirect; use the canonical id directly.
    hub_id: "nilc-nlp/assin2"
    enabled: true

  copa_pt:
    task: "copa_pt"
    group: "semantica"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/copa_pt was fabricated. Replaced with PORTULAN/extraglue,
    # config "copa_pt-BR" (train 400 / val 100 / test 500). Loaded from the
    # "validation" split in copa_pt.py: the "test" split has masked (-1)
    # labels for every row (GLUE/SuperGLUE test-label-hiding convention).
    hub_id: "PORTULAN/extraglue"
    subset: "copa_pt-BR"
    enabled: true

  boolq_pt:
    task: "boolq_pt"
    group: "semantica"
    metric: "boolq_accuracy"
    num_shots: 5
    # Se7enB/boolq_pt was fabricated. Replaced with PORTULAN/extraglue,
    # config "boolq_pt-BR" (train 9427 / val 3270 / test 3245). Loaded from
    # the "validation" split (see copa_pt note above re: masked test labels).
    hub_id: "PORTULAN/extraglue"
    subset: "boolq_pt-BR"
    enabled: true

  mrpc_pt:
    task: "mrpc_pt"
    group: "semantica"
    metric: "accuracy"
    num_shots: 5
    # Previously dead/orphaned (not referenced here, no default hub_id in
    # mrpc_pt.py). Real dataset: PORTULAN/extraglue, config "mrpc_pt-BR"
    # (train 3668 / val 408 / test 1725). Unlike copa/boolq/rte, its "test"
    # split does carry real (non-masked) labels.
    hub_id: "PORTULAN/extraglue"
    subset: "mrpc_pt-BR"
    enabled: true

  rte_pt:
    task: "rte_pt"
    group: "semantica"
    metric: "accuracy"
    num_shots: 5
    # Previously dead/orphaned (not referenced here, no default hub_id in
    # rte_pt.py). Real dataset: PORTULAN/extraglue, config "rte_pt-BR"
    # (train 2490 / val 277 / test 3000). Loaded from "validation" (its
    # "test" split has masked -1 labels, like copa/boolq).
    hub_id: "PORTULAN/extraglue"
    subset: "rte_pt-BR"
    enabled: true

  # =========================================================================
  # GRUPO: Classificação Social (sentimento, discurso de ódio)
  # =========================================================================
  hatebr:
    task: "hatebr"
    group: "classificacao_social"
    metric: "macro_f1"
    num_shots: 5
    # Se7enB/HateBR was fabricated. Replaced with ruanchaves/hatebr (real;
    # train 4480 / val 1120 / test 1400). Its main branch uses a legacy
    # loading script (needs the refs/convert/parquet revision — see hatebr.py).
    hub_id: "ruanchaves/hatebr"
    enabled: true

  tweet_sentbr:
    task: "tweet_sentbr"
    group: "classificacao_social"
    metric: "macro_f1"
    num_shots: 5
    # Se7enB/TweetSentBR was fabricated. Replaced with
    # eduagarcia/tweetsentbr_fewshot (real; train=75 few-shot pool, test=2010).
    hub_id: "eduagarcia/tweetsentbr_fewshot"
    enabled: true

  # =========================================================================
  # GRUPO: Jurídico (OAB, NER jurídico, benchmarks legais)
  # =========================================================================
  oab_bench:
    task: "oab_bench"
    group: "juridico"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/oab_exams was fabricated. Replaced with eduagarcia/oab_exams
    # (real; split "train", 2210 rows).
    hub_id: "eduagarcia/oab_exams"
    rubric_mode: false
    enabled: true

  lener_br:
    task: "lener_br"
    group: "juridico"
    metric: "entity_micro_f1"
    num_shots: 0
    # HuggingFaceGECLNLP/lener_br was fabricated. Replaced with peluz/lener_br
    # (real; train 7828 / val 1177 / test 1390). Loaded via the
    # refs/convert/parquet revision (main branch uses a legacy loading
    # script no longer executed by datasets>=3.0 — see lener_br.py).
    hub_id: "peluz/lener_br"
    enabled: true

  legalbench_br:
    task: "legalbench_br"
    group: "juridico"
    metric: "accuracy"
    num_shots: 5
    # eduagarcia/legalbench_br does not exist; no direct Brazilian-Portuguese
    # LegalBench equivalent is published on the Hub. A second OAB-based task
    # would be redundant with oab_bench, so instead this is wired to
    # eduagarcia/portuguese_benchmark, config "brazilian_court_decisions_judgment"
    # (real Brazilian-legal-domain classification: acórdão judgment outcome,
    # 3 classes no/partial/yes, split "test", 405 rows) — see legalbench_br.py.
    # (Closest EU-Portuguese, non-BR, alternative if ever needed instead:
    # BeatrizCanaverde/LegalBench.PT.)
    hub_id: "eduagarcia/portuguese_benchmark"
    subset: "brazilian_court_decisions_judgment"
    enabled: true

  # =========================================================================
  # GRUPO: Cultura (provérbios, conhecimento cultural)
  # =========================================================================
  broverbs:
    task: "broverbs"
    group: "cultura"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/broverbs was fabricated. Replaced with Tropic-AI/BRoverbs (real;
    # 193 proverbs / 579 stories; splits "history_to_proverb"/"proverb_to_history").
    hub_id: "Tropic-AI/BRoverbs"
    enabled: true

  capitu:
    task: "capitu"
    group: "cultura"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/capitu was fabricated, and no public HF dataset exists for CAPITU
    # (paper arXiv:2603.22576, code at github.com/maritaca-ai/capitu, no HF
    # dataset). Disabled by default. To enable, obtain the data from the
    # GitHub repo directly and set `local_path` to a local JSONL file
    # (BaseTask.load_data already supports this fallback).
    enabled: false

  # =========================================================================
  # GRUPO: Raciocínio Matemático
  # =========================================================================
  math_pt:
    task: "math_pt"
    group: "raciocinio"
    metric: "accuracy"
    num_shots: 0
    # Se7enB/math_pt was fabricated, and no verified Brazilian-Portuguese
    # math benchmark was found on the Hub. Disabled by default.
    enabled: false

  # =========================================================================
  # GRUPO: Audiências Públicas / Domínio Público
  # =========================================================================
  publichearing_br:
    task: "publichearing_br"
    group: "dominio_publico"
    metric: "macro_f1"
    num_shots: 5
    # Se7enB/publichearing_br was fabricated, but a real dataset exists:
    # unicamp-dl/PublicHearingBR (206 public-hearing transcripts). The repo
    # mixes two incompatible JSONL files; publichearing_br.py selects the
    # summarization (LDS) file explicitly via `data_files`.
    hub_id: "unicamp-dl/PublicHearingBR"
    enabled: true

  # =========================================================================
  # GRUPO: Segurança
  # =========================================================================
  donotanswer_pt:
    task: "donotanswer_pt"
    group: "seguranca"
    metric: "refusal_rate"
    num_shots: 0
    # Se7enB/donotanswer_pt was fabricated, and no public HF dataset exists
    # for a Brazilian-Portuguese DoNotAnswer (a CLARIN-PT-LDB translation is
    # referenced in arXiv:2603.12872 but isn't published as a standalone HF
    # dataset). Disabled by default. LibrAI/do-not-answer (English,
    # cc-by-nc-sa) could be used as an approximate fallback signal, but is
    # not wired in automatically here (language mismatch).
    enabled: false

  # =========================================================================
  # GRUPO: Exploratórios (habilitados mas não obrigatórios)
  # =========================================================================
  xlsum_pt:
    task: "xlsum_pt"
    group: "exploratorio"
    metric: "rouge_l"
    num_shots: 0
    hub_id: "csebuetnlp/xlsum"
    subset: "portuguese"
    secondary_metric: "bert_score"
    enabled: true

  alba:
    task: "alba"
    group: "exploratorio"
    metric: "accuracy"
    num_shots: 5
    hub_id: "Se7enB/alba"
    enabled: false

  mariner:
    task: "mariner"
    group: "exploratorio"
    metric: "entity_micro_f1"
    num_shots: 0
    hub_id: "Se7enB/mariner_pt"
    enabled: false

  # =========================================================================
  # GRUPO: Retenção em Inglês (verifica catastrophic forgetting)
  # =========================================================================
  mmlu_en_sample:
    task: "mmlu_en"
    group: "retencao_en"
    metric: "accuracy"
    num_shots: 5
    hub_id: "cais/mmlu"
    subset: "all"
    # Amostra de 500 questões para check rápido
    max_samples: 500
    enabled: true

  hellaswag_en_sample:
    task: "hellaswag_en"
    group: "retencao_en"
    metric: "accuracy"
    num_shots: 0
    hub_id: "Rowan/hellaswag"
    max_samples: 500
    enabled: true

  arc_en_sample:
    task: "arc_en"
    group: "retencao_en"
    metric: "accuracy"
    num_shots: 5
    hub_id: "allenai/ai2_arc"
    subset: "ARC-Challenge"
    max_samples: 500
    enabled: true

# =============================================================================
# Modelos a Avaliar
# =============================================================================
models_to_evaluate:
  # --- Baselines obrigatórios ---
  - id: "google/gemma-4-E4B-it"
    name: "Gemma4-E4B-IT"
    type: "baseline"
    is_chat_model: true
    prompt_builder: "gemma4"

  - id: "CEIA-UFG/Gemma-3-Gaia-PT-BR-4b-it"
    name: "Gaia-PT-BR-4B"
    type: "baseline"
    is_chat_model: true
    prompt_builder: "gemma3"  # Usa template Gemma 3

  - id: "maritaca-ai/sabia-7b"
    name: "Sabia-7B"
    type: "baseline"
    is_chat_model: false  # Modelo base, não instruction-tuned
    prompt_builder: "few_shot_plain"  # Protocolo few-shot sem chat template
    num_shots_override: 5  # Sempre usa few-shot para Sabia

  # --- Baseline opcional ---
  - id: "TucanoBR/Tucano-2-7b-instruct"
    name: "Tucano2-7B-Instruct"
    type: "baseline"
    is_chat_model: true
    prompt_builder: "chatml"  # TODO: Verificar template do Tucano
    enabled: false

  # --- Modelos adaptados (caminhos preenchidos após treino) ---
  - id: "outputs/cpt_pilot/final"
    name: "CPT-E4B-Pilot"
    type: "cpt"
    is_chat_model: false
    prompt_builder: "few_shot_plain"

  - id: "outputs/cpt_main/final"
    name: "CPT-E4B"
    type: "cpt"
    is_chat_model: false
    prompt_builder: "few_shot_plain"

  - id: "outputs/residual_merge/alpha_best"
    name: "CPT+Merge-E4B"
    type: "merge"
    is_chat_model: true
    prompt_builder: "gemma4"

  - id: "outputs/sft/final"
    name: "CPT+SFT-E4B"
    type: "sft"
    is_chat_model: true
    prompt_builder: "gemma4"

# =============================================================================
# Configuração de Relatório
# =============================================================================
report:
  output_dir: "reports"
  formats: ["csv", "markdown", "json"]
  # src/eval/bootstrap_ci.py now defaults to 10000 resamples (percentile/BCa
  # interval endpoints need many more resamples than a standard-error
  # estimate does — see that module's docstring); kept in sync here.
  bootstrap_n: 10000
  confidence_level: 0.95
  generate_plots: true
  plot_types: ["heatmap", "radar", "bar", "scaling_curves", "retention_plot"]
