# =============================================================================
# CPT Piloto para Google Colab (GPU única: T4 16GB / L4 24GB / A100 40GB)
# =============================================================================
# Diferenças em relação a configs/train/cpt_pilot.yaml (trilha "completa"):
#   - Usa Gemma 4 E2B (~2.3B efetivos) em vez de E4B — cabe com folga em
#     QLoRA numa única GPU de Colab, inclusive o T4 16GB gratuito.
#   - max_seq_length=2048 (não 8192) — reduz VRAM e tempo por step.
#   - learning_rate mais baixo (2e-5, não 2e-4): para CPT (não instruction
#     tuning), a literatura recomenda LR de LoRA ~1e-5 a 5e-5, não a regra
#     "10x maior que full fine-tune" que vale para IFT. Ver
#     docs/CPT_BEST_PRACTICES_RESEARCH.md (Biderman et al. 2024).
#   - max_steps curto (300) — um piloto de demonstração que cabe numa única
#     sessão do Colab (T4 free: ~algumas horas; A100: mais rápido ainda).
#     Para uma run "de verdade" (orçamento de tokens maior), aumente
#     max_steps e/ou rode em múltiplas sessões usando push_to_hub +
#     resume automático (ver colab/README.md).
#   - Checkpoints vão para o HF Hub (push_to_hub), não GCS — o Colab não tem
#     disco persistente entre sessões.
#
# Uso:
#   gemma4pt train-cpt configs/train/cpt_colab_pilot.yaml
# ou, para um smoke test de poucos passos antes de comprometer a sessão:
#   gemma4pt train-cpt configs/train/cpt_colab_pilot.yaml --tiny

experiment:
  name: "cpt_colab_pilot_e2b_qlora"
  description: "CPT piloto (QLoRA) no Gemma 4 E2B para uma única sessão de Colab"
  seed: 42
  trilha: "colab"

model_config: "configs/model/gemma4_e2b.yaml"
data_config: "configs/data/aurora_pt.yaml"

data_mixture: "pt_en_15"  # 85% PT (Aurora-PT) + 15% replay EN (FineWeb-Edu)

training:
  method: "cpt"
  peft_method: "qlora"  # "lora" | "dora" | "qlora" | "full" — QLoRA para caber em 1 GPU
  use_lora: true
  num_train_epochs: 1
  max_steps: 300
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  # Batch efetivo: 4 * 8 * 2048 ~= 65K tokens/step

  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0

  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

  dataloader_num_workers: 2
  dataloader_pin_memory: true

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  bias: "none"

packing:
  enabled: true
  eos_separator: true
  mask_cross_doc_labels: true

data:
  curriculum_sort: false

checkpointing:
  save_steps: 50
  save_total_limit: 2
  resume_from_checkpoint: null

logging:
  log_level: "info"
  logging_steps: 5
  # Set to ["wandb"] (and run `wandb.login()` in the notebook) for live
  # dashboards; resolve_report_to() drops it gracefully if wandb isn't
  # installed/logged in.
  report_to: ["none"]
  log_file: "outputs/cpt_colab_pilot/train_log.jsonl"

evaluation:
  eval_steps: 50
  eval_strategy: "steps"
  metric_for_best_model: "eval_loss"
  greater_is_better: false

forgetting_monitor:
  eval_interval_steps: 50
  max_eval_samples: 50

early_stopping:
  enabled: false

output:
  output_dir: "outputs/cpt_colab_pilot"
  overwrite_output_dir: false
  # Set push_to_hub: true and hub_model_id to your own
  # "your-username/gemma4-e2b-ptbr-cpt-pilot" repo to checkpoint to the HF
  # Hub instead of (only) local disk — required for surviving a Colab
  # session restart. hub_strategy="checkpoint" pushes a `last-checkpoint/`
  # folder on every save that a new session can resume from.
  push_to_hub: false
  hub_model_id: null
  hub_strategy: "checkpoint"
  hub_private_repo: true
