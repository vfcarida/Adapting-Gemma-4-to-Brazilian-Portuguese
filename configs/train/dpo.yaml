experiment:
  name: "dpo_e4b_ptbr"
  description: "DPO on SFT checkpoint (optional stage)"
  seed: 42

model_config: "configs/model/gemma4_e4b.yaml"
base_checkpoint: "outputs/sft/final"  # SFT output

training:
  method: "dpo"
  use_lora: true
  num_train_epochs: 1
  max_steps: 2000
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16

  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_grad_norm: 1.0

  bf16: true
  gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  task_type: "CAUSAL_LM"

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  # trl>=1.0's DPOConfig dropped the separate max_prompt_length parameter
  # this used to have (see src/train/dpo_trainer.py) — max_length is the
  # only length control now, applied to the whole prompt+completion
  # sequence.
  max_length: 2048
  # Real, ungated, apache-2.0 Portuguese preference dataset (prompt/chosen/
  # rejected as plain strings — matches _load_preference_data's expected
  # schema exactly). 19,279 rows. Verified to exist on the HF Hub.
  # Swap for your own curated preferences when available; DPO remains an
  # optional/experimental stage (CPT → SFT are the primary pipeline).
  dataset_hub_id: "celsowm/gemini_orpo_dpo_ptbr"
  dataset_path: null

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  logging_steps: 10
  report_to: ["none"]
  log_file: "outputs/dpo/train_log.jsonl"

output:
  output_dir: "outputs/dpo"
  overwrite_output_dir: false
