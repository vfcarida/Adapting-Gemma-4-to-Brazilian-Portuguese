experiment:
  name: "sft_e4b_ptbr"
  description: "SFT on CPT checkpoint with Portuguese instruction data"
  seed: 42

model_config: "configs/model/gemma4_e4b.yaml"
base_checkpoint: "outputs/cpt_main/final"  # CPT output

training:
  method: "sft"
  use_lora: true
  num_train_epochs: 3
  max_steps: -1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8

  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0

  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  bias: "none"

sft:
  # Instruction data sources (in priority order). Both are real, ungated,
  # Alpaca-schema (instruction/input/output) Portuguese datasets verified to
  # exist on the HF Hub — InstructionDataBuilder._normalize_columns already
  # auto-detects this schema.
  datasets:
    - hub_id: "rhaymison/superset"  # ~100K-1M rows, no restrictive license tag
      weight: 0.7
    - hub_id: "dominguesm/alpaca-data-pt-br"  # translated Alpaca, cc-by-nc-4.0
      weight: 0.3

  max_seq_length: 4096
  packing: false
  train_on_completions_only: true
  use_think_tokens: false  # Control thinking mode
  # Real Gemma 4 model-turn marker (verified live against the tokenizer's
  # own chat template — see src/data/instruction_data_builder.py's
  # GEMMA4_MODEL_PREFIX docstring). NOT "<start_of_turn>model\n", which is
  # Gemma 2/3's format.
  response_template: "<|turn>model\n"

  # Chat template format
  format: "gemma4"
  system_message: null  # Gemma 4 does not use system messages

data_mix:
  pt_ratio: 0.8
  en_ratio: 0.2
  include_translation_pairs: true

checkpointing:
  save_steps: 200
  save_total_limit: 5

logging:
  logging_steps: 10
  # "json" is not a valid transformers integration (metrics are already
  # persisted separately via MetricsLogger to log_file below as JSONL).
  # Add "wandb"/"tensorboard" here if those packages are installed —
  # resolve_report_to() in src/utils/logging_utils.py drops any requested
  # backend that isn't actually usable instead of crashing.
  report_to: ["none"]
  log_file: "outputs/sft/train_log.jsonl"

output:
  output_dir: "outputs/sft"
  overwrite_output_dir: false
