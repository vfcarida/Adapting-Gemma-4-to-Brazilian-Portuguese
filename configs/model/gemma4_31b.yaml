# =============================================================================
# Configuração do Modelo — Gemma 4 31B Dense (Trilha Opcional)
# =============================================================================
# Modelo: google/gemma-4-31B (base) / google/gemma-4-31B-it (instruct)
# Arquitetura: Dense transformer, 31B parâmetros
# Uso: Trilha opcional final se orçamento computacional permitir
# TODO: Confirmar model IDs exatos quando disponíveis publicamente

model:
  base_id: "google/gemma-4-31B"
  instruct_id: "google/gemma-4-31B-it"
  family: "gemma4"
  architecture: "dense"
  params_total: "31B"
  dtype: "bfloat16"
  max_seq_length: 8192
  attn_implementation: "flash_attention_2"
  trust_remote_code: true

  text_only_mode: true

tokenizer:
  # use_fast/padding_side documentam o que load_tokenizer() (src/utils/hf_utils.py)
  # já hardcoda (use_fast=True, padding_side="right") — mudar aqui não tem
  # efeito algum, o valor real vem do código, não deste YAML.
  use_fast: true
  padding_side: "right"
  # NOTA: add_eos_token e use_apply_chat_template não são lidos em lugar
  # nenhum — load_tokenizer() é chamado sem kwargs em todos os call sites
  # (cpt_trainer.py, sft_trainer.py, dpo_trainer.py, cli.py), e o uso de
  # apply_chat_template em prompt_templates.py é incondicional (não lê
  # este toggle). Mantidos como documentação da intenção até serem
  # conectados ou removidos.
  add_eos_token: true
  use_apply_chat_template: true

chat_template_fallback:
  bos_token: "<bos>"
  user_prefix: "<|turn>user\n"
  user_suffix: "<turn|>\n"
  model_prefix: "<|turn>model\n"
  model_suffix: "<turn|>\n"
  system_prefix: "<|turn>system\n"
  system_suffix: "<turn|>\n"
  think_open: "<|think|>\n"
  # NOTA: think_close não é lido em nenhum lugar — _format_gemma4_manual
  # (src/eval/prompt_templates.py) só monta o PROMPT até o generation
  # prompt (model_prefix + think_open quando think_mode=="on"); fechar o
  # bloco de pensamento é responsabilidade do próprio modelo gerar, não
  # do template. O parsing do output gerado (strip_thought/extract_thought,
  # no mesmo arquivo) usa os marcadores reais via regex global, não este
  # valor por-modelo. Mantido aqui como documentação do marcador real.
  think_close: "<channel|>\n"

thinking:
  empty_channel_for_non_think: true

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# Expansão vocabular NÃO implementada — decisão deliberada, não lacuna.
# Chegou a existir aqui como bloco de config (enabled: false, nunca
# conectado a nenhum código), mas foi removida em vez de mantida como
# "aspiracional": um audit fertility real (src/data/tokenizer_audit.py)
# rodado ao vivo em 2026-08 contra o tokenizer real do google/gemma-4-E2B-it
# (262144 tokens de vocabulário) mostrou tokens_per_word≈1.37 em PT-BR vs.
# ≈1.11 em EN — uma razão de ~1.24x, bem abaixo do problema clássico de
# fertility (1.8-2.5x) que motivava expansão vocabular em tokenizers
# antigos com vocabulário pequeno e majoritariamente em inglês (ex.
# LLaMA-1/2, 32k tokens). O vocabulário grande e multilíngue do Gemma 4 já
# lida com português razoavelmente bem; implementar expansão vocabular
# (embeddings novos, cuidado para não colidir com os marcadores especiais
# reais do chat template — ver GEMMA4_COMPLIANCE.md — validação que exige
# GPU) não se justifica pelo ganho marginal medido. Reavaliar apenas se
# um audit de fertility em corpus maior mostrar um gap bem mais severo.
