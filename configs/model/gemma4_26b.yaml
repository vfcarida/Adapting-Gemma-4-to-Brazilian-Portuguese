# =============================================================================
# Configuração do Modelo — Gemma 4 26B-A4B (Trilha Principal)
# =============================================================================
# Modelo: google/gemma-4-26B-A4B (base) / google/gemma-4-26B-A4B-it (instruct)
# Arquitetura: Mixture of Experts, 26B total / ~4B ativados por token
# Uso: Trilha principal para resultados finais de publicação

model:
  base_id: "google/gemma-4-26B-A4B"
  instruct_id: "google/gemma-4-26B-A4B-it"
  family: "gemma4"
  architecture: "mixture_of_experts"
  params_total: "26B"
  params_active: "4B"
  dtype: "bfloat16"
  max_seq_length: 8192
  attn_implementation: "flash_attention_2"
  trust_remote_code: true

  # Text-only: congela encoders visuais
  text_only_mode: true

tokenizer:
  # use_fast/padding_side documentam o que load_tokenizer() (src/utils/hf_utils.py)
  # já hardcoda (use_fast=True, padding_side="right") — mudar aqui não tem
  # efeito algum, o valor real vem do código, não deste YAML.
  use_fast: true
  padding_side: "right"
  # NOTA: add_eos_token e use_apply_chat_template não são lidos em lugar
  # nenhum — load_tokenizer() é chamado sem kwargs em todos os call sites
  # (cpt_trainer.py, sft_trainer.py, dpo_trainer.py, cli.py), e o uso de
  # apply_chat_template em prompt_templates.py é incondicional (não lê
  # este toggle). Mantidos como documentação da intenção até serem
  # conectados ou removidos.
  add_eos_token: true
  use_apply_chat_template: true

chat_template_fallback:
  bos_token: "<bos>"
  user_prefix: "<|turn>user\n"
  user_suffix: "<turn|>\n"
  model_prefix: "<|turn>model\n"
  model_suffix: "<turn|>\n"
  system_prefix: "<|turn>system\n"
  system_suffix: "<turn|>\n"
  think_open: "<|think|>\n"
  # NOTA: think_close não é lido em nenhum lugar — _format_gemma4_manual
  # (src/eval/prompt_templates.py) só monta o PROMPT até o generation
  # prompt (model_prefix + think_open quando think_mode=="on"); fechar o
  # bloco de pensamento é responsabilidade do próprio modelo gerar, não
  # do template. O parsing do output gerado (strip_thought/extract_thought,
  # no mesmo arquivo) usa os marcadores reais via regex global, não este
  # valor por-modelo. Mantido aqui como documentação do marcador real.
  think_close: "<channel|>\n"

thinking:
  empty_channel_for_non_think: true

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

vocab_expansion:
  enabled: false
  sizes: [8000, 16000, 32000]
  preserve_special_tokens: true
  init_method: "mean"
